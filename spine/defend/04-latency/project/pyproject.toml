[project]
name = "retail-lakehouse"
version = "0.1.0"
requires-python = ">=3.13"
# none: Spark and Delta come from the runtime — locally, from requirements.txt
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

# the job's wheel tasks call these by name (resources/retail_daily.yml)
[project.scripts]
ingest = "retail.jobs:ingest"
transform = "retail.jobs:transform"
validate = "retail.jobs:validate"
publish = "retail.jobs:publish"
alert = "retail.jobs:alert"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
