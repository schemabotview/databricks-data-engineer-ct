# Spark's own log messages: warnings and errors only, one line each
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.alwaysWriteExceptions = false
appender.console.layout.pattern = %p %c{1}: %replace{%m}{(?s)\n.*}{}%n
# Hadoop's native-library notice is not about your job
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error
# The local metastore is Hive's and does not know Delta: it warns on every CREATE TABLE
logger.hive.name = org.apache.spark.sql.hive.HiveExternalCatalog
logger.hive.level = error
# Delta re-counts the rows an UPDATE or DELETE touched, and warns when a table
# has no statistics to check against; the count it prints is still exact
logger.deltacommands.name = org.apache.spark.sql.delta.commands
logger.deltacommands.level = error
# a stream cannot use adaptive query execution, and says so each time one starts
logger.streamaqe.name = org.apache.spark.sql.execution.streaming.ResolveWriteToStream
logger.streamaqe.level = error
# the local Hive metastore cannot hold a Delta table's schema (Delta keeps it in
# its own log), and logs an error each time an overwrite tries to update it
logger.hivealter.name = org.apache.hadoop.hive.metastore.HiveAlterHandler
logger.hivealter.level = fatal
logger.hivehms.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.hivehms.level = fatal
# a restarted stream reloads its state from the checkpoint, and says so (normal)
logger.statestore.name = org.apache.spark.sql.execution.streaming.state.HDFSBackedStateStoreProvider
logger.statestore.level = error
# a MERGE materialises its source once, and notes that the copy cannot be rebuilt
logger.mergesource.name = org.apache.spark.rdd.MapPartitionsRDD
logger.mergesource.level = error
